<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGRIS | AI System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-grid"></div>
    
    <!-- Top Bar -->
    <header class="top-bar glass-panel">
        <div class="system-status">
            <span class="status-indicator"></span>
            <span class="status-text">SYSTEM ONLINE</span>
        </div>
        <div class="system-title">IGRIS <span class="version">v2.0.0</span></div>
        <div class="system-metrics">
            <span id="ping-metric">PING: 0ms</span>
            <button id="mini-mode-btn" class="cyber-button" style="padding: 2px 5px; font-size: 0.7rem; margin-left: 10px;">MINI</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        
        <!-- Left Panel: Assistant Visualizer -->
        <section class="visualizer-panel glass-panel">
            <div class="orb-container">
                <div class="orb" id="igris-orb">
                    <div class="orb-core"></div>
                    <div class="orb-ring ring-1"></div>
                    <div class="orb-ring ring-2"></div>
                    <div class="orb-ring ring-3"></div>
                </div>
            </div>
            <div class="assistant-state">
                <h2 id="state-text">IDLE</h2>
                <p id="status-message">Awaiting Input...</p>
            </div>
        </section>

        <!-- Right Panel: Communication Interface -->
        <section class="comm-panel glass-panel">
            <div class="chat-container" id="chat-container">
                <div class="message system-msg">
                    <span class="sender">[SYSTEM]:</span>
                    <span class="content">Secure channel established. Ready for interaction.</span>
                </div>
            </div>
            
            <div class="input-container">
                <div class="input-wrapper">
                    <span class="prompt-symbol">></span>
                    <input type="text" id="user-input" placeholder="Enter command or query..." autocomplete="off">
                    <button id="voice-btn" class="voice-activate-btn" title="Start voice conversation">
                        <svg class="voice-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="6" width="2" height="12" rx="1" class="wave-bar bar-1"/>
                            <rect x="6" y="3" width="2" height="18" rx="1" class="wave-bar bar-2"/>
                            <rect x="10" y="8" width="2" height="8" rx="1" class="wave-bar bar-3"/>
                            <rect x="14" y="4" width="2" height="16" rx="1" class="wave-bar bar-4"/>
                            <rect x="18" y="6" width="2" height="12" rx="1" class="wave-bar bar-5"/>
                        </svg>
                    </button>
                    <button id="send-btn" class="cyber-button">SEND</button>
                </div>
            </div>
        </section>
        
    </main>

    <!-- Voice Mode Overlay (hidden by default) -->
    <div id="voice-overlay" class="voice-overlay hidden">
        <div class="voice-overlay-backdrop"></div>
        <div class="voice-overlay-content">
            <!-- Close / End button at top right -->
            <button id="voice-close-btn" class="voice-close-btn" title="End voice mode">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <!-- Main voice orb -->
            <div class="voice-orb-wrapper">
                <div class="voice-orb" id="voice-orb">
                    <div class="voice-orb-glow"></div>
                    <div class="voice-orb-core"></div>
                    <div class="voice-ripple ripple-1"></div>
                    <div class="voice-ripple ripple-2"></div>
                    <div class="voice-ripple ripple-3"></div>
                </div>
            </div>

            <!-- State label -->
            <div class="voice-state-label" id="voice-state-label">Tap to start speaking</div>

            <!-- Live transcript area -->
            <div class="voice-transcript-area">
                <div class="voice-transcript" id="voice-transcript"></div>
                <div class="voice-response" id="voice-response"></div>
            </div>

            <!-- Bottom controls -->
            <div class="voice-controls">
                <button id="voice-mode-toggle" class="voice-control-btn" title="Switch between hands-free and push-to-talk">
                    <svg id="mode-icon-handsfree" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                    <span id="mode-label">HANDS-FREE</span>
                </button>
                <button id="voice-interrupt-btn" class="voice-control-btn voice-interrupt" title="Interrupt">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16" rx="1"/>
                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                    </svg>
                    <span>INTERRUPT</span>
                </button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
